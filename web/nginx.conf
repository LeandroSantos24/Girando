# App (/) y Admin (/admin) estáticos + proxy de /api hacia FastAPI. Mismo origen → sin CORS en el navegador.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 11m;   # fotos de hasta 10 MB (la API vuelve a validar)
    charset utf-8;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;      # la API solo la acepta si viene de este contenedor (TRUSTED_PROXIES)
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
    }
    # Fotos de desarrollo (IMAGE_STORAGE=local_dev). En producción las fotos salen de Cloudinary.
    location /media/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }
    location = /admin { return 301 /admin/; }
    location /admin/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri /admin/index.html;
    }
    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }
}

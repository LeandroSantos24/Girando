# Cabeceras de seguridad de la App y el Admin (la API define las suyas).
# La CSP es la que la App necesita de verdad:
#  - script-src 'unsafe-eval': el runtime del diseño (support.js) compila las plantillas con new Function.
#    Desde la fase 2 ya no se usa Babel ni el marco de iPhone (ios-frame.jsx). No hay scripts inline ni de terceros.
#  - style-src 'unsafe-inline': los estilos del diseño son atributos style.
#  - img-src: fotos locales (/media, solo desarrollo) y Cloudinary.  frame-src: videos de YouTube (sin cookies).
# Mantener igual que scripts/dev-web.mjs.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://res.cloudinary.com; font-src 'self'; connect-src 'self' https://api.cloudinary.com; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# HSTS: solo detrás de HTTPS (lo agrega el proxy/terminador TLS de producción, ver SECURITY.md)
